<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Claude Code Trajectory</title>
    <script>
      // Applies the theme saved by ThemeToggle before anything renders, so a forced light or dark page never flashes the other one.
      try {
        var theme = localStorage.getItem("cc-trajectory:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="color-scheme"]').content = theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
